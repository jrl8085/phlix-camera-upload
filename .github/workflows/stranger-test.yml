      # -- Unraid, with the template -----------------------------------------

      # The guide: open the Unraid terminal (it runs as root), make the
      # upload folder in a share of the Plex library, give it to 99:100,
      # then download the template.
      - name: "Unraid: make the upload folder, and give it to Unraid's standard user and group"
        if: matrix.way == 'unraid'
        run: |
          set -euo pipefail
          sudo mkdir "/mnt/user/Photos/Camera Uploads"
          sudo chown 99:100 "/mnt/user/Photos/Camera Uploads"
          ls -ldn "$PHOTOS"

      - name: "Unraid: download the template, as the guide says"
        if: matrix.way == 'unraid'
        run: |
          set -euo pipefail
          # The Unraid terminal runs as root, and this folder is on the
          # flash drive of every Unraid server.
          sudo mkdir -p /boot/config/plugins/dockerMan/templates-user
          sudo wget -O /boot/config/plugins/dockerMan/templates-user/my-phlix-camera-upload.xml https://raw.githubusercontent.com/jrl8085/phlix-camera-upload/main/unraid/phlix-camera-upload.xml
          cp /boot/config/plugins/dockerMan/templates-user/my-phlix-camera-upload.xml "$RUNNER_TEMP/template.xml"

      - name: "Unraid: the template is well-formed and names the public image"
        if: matrix.way == 'unraid'
        run: |
          set -euo pipefail
          compose_image=$(curl -fsSL "$GUIDE/docker-compose.yml" | sed -n 's/^ *image: *//p' | head -n 1)
          python3 -I - "$RUNNER_TEMP/template.xml" "$compose_image" "$RAW/unraid/phlix-camera-upload.xml" <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request
          import xml.dom.minidom
          import xml.etree.ElementTree as ElementTree

          path, compose_image, template_url = sys.argv[1:]
          problems = []
          xml.dom.minidom.parse(path)
          print("Well-formed XML.")
          root = ElementTree.parse(path).getroot()

          def text(tag):
              return (root.findtext(tag) or "").strip()

          expect = {
              "Name": "phlix-camera-upload",
              "Repository": compose_image,
              "Network": "bridge",
              "Privileged": "false",
              "WebUI": "https://[IP]:[PORT:7459]/",
              "TemplateURL": template_url,
          }
          if root.tag != "Container":
              problems.append(f"the root element is <{root.tag}>, not <Container>")
          for tag, wanted in expect.items():
              if text(tag) != wanted:
                  problems.append(f"<{tag}> is {text(tag)!r}, not {wanted!r}")
          if "--add-host=host.docker.internal:host-gateway" not in text("ExtraParams").split():
              problems.append("<ExtraParams> lacks --add-host=host.docker.internal:host-gateway")
          configs = {entry.get("Name"): entry for entry in root.findall("Config")}
          wanted_configs = {
              "Port": ("Port", "7459", "tcp", "7459"),
              "Photos": ("Path", "/photos", "rw", ""),
              "Helper data": ("Path", "/config", "rw", "/mnt/user/appdata/phlix-camera-upload"),
              "PUID": ("Variable", "PUID", "", "99"),
              "PGID": ("Variable", "PGID", "", "100"),
          }
          for name, (kind, target, mode, value) in wanted_configs.items():
              entry = configs.get(name)
              if entry is None:
                  problems.append(f"no Config named {name}")
                  continue
              found = (entry.get("Type"), entry.get("Target"), entry.get("Mode") or "", (entry.text or "").strip())
              if found != (kind, target, mode, value):
                  problems.append(f"Config {name} is {found}, not {(kind, target, mode, value)}")
          if configs.get("Photos") is not None and configs["Photos"].get("Required") != "true":
              problems.append("Photos is not Required, so Unraid would let Apply go without it")
          print(f"It names the image {text('Repository')}, the one the guide's Compose file names.")

          def fetch(request):
              """(headers, JSON body). Tries three times when the network or the registry hiccups."""
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return response.headers, json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code < 500 and error.code != 429 or attempt == 2:
                          raise
                  except (urllib.error.URLError, TimeoutError, ConnectionError):
                      if attempt == 2:
                          raise
                  time.sleep(5 * (attempt + 1))

          # The image it names comes down without signing in, for amd64: Unraid runs there.
          repository, tag = text("Repository")[len("ghcr.io/"):].rsplit(":", 1)
          _, answer = fetch(f"https://ghcr.io/token?scope=repository:{repository}:pull&service=ghcr.io")
          token = answer["token"]
          print(f"::add-mask::{token}")
          headers, index = fetch(urllib.request.Request(f"https://ghcr.io/v2/{repository}/manifests/{tag}", headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json"}))
          digest = headers.get("Docker-Content-Digest")
          platforms = {(entry.get("platform") or {}).get("architecture") for entry in index.get("manifests", [])}
          if "amd64" not in platforms:
              problems.append(f"{text('Repository')} has no amd64 image")
          print(f"{text('Repository')} is {digest}, pulled anonymously; amd64 is in it.")
          for problem in problems:
              print(f"::error::Unraid template: {problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: "Unraid: the template's links answer"
        if: matrix.way == 'unraid'
        run: |
          set -euo pipefail
          for tag in Support Project Registry Icon TemplateURL; do
            url=$(sed -n "s|^ *<$tag>\(.*\)</$tag>.*|\1|p" "$RUNNER_TEMP/template.xml" | head -n 1)
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$url")
            echo "$tag  $url  HTTP $status"
            [ "$status" = 200 ]
          done

      # Unraid's Docker tab turns the template into one docker run command:
      # each Path is a -v, each Port a -p, each Variable an -e (an empty one
      # too), then ExtraParams and the Repository. The person sets Photos
      # and leaves every other field as the template has it.
      - name: "Unraid: Add Container, set Photos, Apply"
        if: matrix.way == 'unraid'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/unraid-apply.py" <<'PY'
          import shlex
          import subprocess
          import sys
          import xml.etree.ElementTree as ElementTree

          template, photos = sys.argv[1:]
          root = ElementTree.parse(template).getroot()

          def text(tag):
              return (root.findtext(tag) or "").strip()

          name = text("Name")
          command = ["docker", "run", "-d", f"--name={name}", f"--net={text('Network')}",
                     "-e", "TZ=America/Chicago", "-e", "HOST_OS=Unraid", "-e", "HOST_HOSTNAME=Tower",
                     "-e", f"HOST_CONTAINERNAME={name}"]
          variables, ports, volumes = [], [], []
          for entry in root.findall("Config"):
              kind, target = entry.get("Type"), entry.get("Target") or ""
              value = (entry.text or "").strip() or (entry.get("Default") or "")
              if entry.get("Name") == "Photos":
                  value = photos
              if entry.get("Required") == "true" and not value:
                  sys.exit(f"Unraid refuses Apply: {entry.get('Name')} is empty")
              if kind == "Path":
                  volumes += ["-v", f"{value}:{target}:{entry.get('Mode') or 'rw'}"]
              elif kind == "Port":
                  ports += ["-p", f"{value}:{target}/{entry.get('Mode') or 'tcp'}"]
              elif kind == "Variable":
                  variables += ["-e", f"{target}={value}"]
          labels = ["-l", "net.unraid.docker.managed=dockerman",
                    "-l", f"net.unraid.docker.webui={text('WebUI')}",
                    "-l", f"net.unraid.docker.icon={text('Icon')}"]
          command += variables + labels + ports + volumes + shlex.split(text("ExtraParams"))
          command += [text("Repository")] + shlex.split(text("PostArgs"))
          print(shlex.join(command), flush=True)
          sys.exit(subprocess.run(command).returncode)
          PY
          python3 -I "$RUNNER_TEMP/unraid-apply.py" "$RUNNER_TEMP/template.xml" "$PHOTOS"

      # -- Check that it runs (every way) ------------------------------------

      - name: The helper answers
        run: |
          set -uo pipefail
          for attempt in $(seq 1 90); do
            if [ "$(curl --silent --insecure --max-time 5 https://127.0.0.1:7459/healthz)" = ok ]; then
              echo "The helper answered after $attempt tries."
              exit 0
            fi
