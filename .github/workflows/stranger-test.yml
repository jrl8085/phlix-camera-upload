            *)
              url="https://$address:7459"
              ;;
          esac
          echo "The status page: $url"
          server=$(printf '%s' "$url" | sed -n 's|^https://\([^:/]*\).*|\1|p')
          echo "SERVER=$server" >> "$GITHUB_ENV"
          curl --silent --show-error --insecure --max-time 30 "$url" > "$RUNNER_TEMP/status-page.html"
          python3 -I -c '
          import html, re, sys
          page = open(sys.argv[1], encoding="utf-8").read()
          for label, value in re.findall(r"<th[^>]*>(.*?)</th>\s*<td[^>]*>(.*?)</td>", page, re.S):
              print(f"{html.unescape(label)}: {html.unescape(value)}")
          ' "$RUNNER_TEMP/status-page.html" | tee "$RUNNER_TEMP/status-page.txt"
          grep --quiet '^Upload folder: Ready$' "$RUNNER_TEMP/status-page.txt"
          grep --quiet '^Plex Media Server: Found' "$RUNNER_TEMP/status-page.txt"
          # The guide: the helper does not answer http://.
          if curl --silent --max-time 10 "http://$server:7459/" > /dev/null; then
            echo "::error::The helper answered http://, and the guide says it does not."
            exit 1
          fi
          echo "http://$server:7459 gets no answer, as the guide says."

      - name: "Check that it runs: the doctor command, as the guide writes it"
        run: |
          set -euo pipefail
          docker exec phlix-camera-upload python -m phlix_upload doctor | tee "$RUNNER_TEMP/doctor.txt"
          grep --quiet --fixed-strings "Nothing needs fixing." "$RUNNER_TEMP/doctor.txt"
          grep --quiet --fixed-strings "OK       Plex Media Server found: its owner can pair from Phlix without a code." "$RUNNER_TEMP/doctor.txt"
          echo "- doctor: Nothing needs fixing." >> "$GITHUB_STEP_SUMMARY"

      - name: "Pairing: the pairing code, as the guide writes it"
        run: |
          set -euo pipefail
          code=$(docker exec phlix-camera-upload python -m phlix_upload code)
          echo "::add-mask::$code"
          if ! [[ $code =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]; then
            echo "::error::The code command printed something that is not a code like K7QM-3XPD."
            exit 1
          fi
          umask 077
          printf '%s' "$code" > "$RUNNER_TEMP/pairing-code"
          echo "The code command printed one code (hidden here)."

      # -- Act as the Phlix app ----------------------------------------------

      - name: "The app: find the helper, pair, upload"
        run: |
          set -euo pipefail
          PAIRING_CODE=$(cat "$RUNNER_TEMP/pairing-code") \
            python3 -I "$RUNNER_TEMP/phone.py" first "$SERVER" "$PHOTOS" "$RUNNER_TEMP/phone-state.json" \
            | tee "$RUNNER_TEMP/phone-first.txt"
          echo "- The app, first visit: $(tail -n 1 "$RUNNER_TEMP/phone-first.txt")" >> "$GITHUB_STEP_SUMMARY"

      - name: "Where your photos go: the upload folder on the server"
        run: |
          set -euo pipefail
          find "$PHOTOS" -path "$PHOTOS/.phlix-upload-tmp" -prune -o -printf '%M %U:%G %TY-%Tm-%Td %TH:%TM  %P\n' | sort -k 5
          docker exec phlix-camera-upload python -m phlix_upload doctor | grep --fixed-strings "2 paired"

      # -- An update and a restart -------------------------------------------

      - name: "Way C: update the helper, then stop and start it"
        if: matrix.way == 'compose'
        run: |
          set -euo pipefail
          cd ~/phlix-camera-upload
          docker compose pull
          docker compose up -d
          docker compose down
          docker compose up -d

      - name: "Way A: run the installer again to update, then stop and start it"
        if: matrix.way == 'installer'
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/person.py" "$RUNNER_TEMP/update.txt" \
            'curl -fsSL https://phlixapp.com/camera-upload/install.sh | sh'
          grep --quiet --fixed-strings "This run updates it." "$RUNNER_TEMP/update.txt"
          grep --quiet --fixed-strings "Nothing needs fixing." "$RUNNER_TEMP/update.txt"
          cd ~/phlix-camera-upload
          docker compose down
          docker compose up -d

      # Unraid's update, and Apply after an edit, remove the container and
      # make it again with the same command.
      - name: "Unraid: the container is made again, as an update does"
        if: matrix.way == 'unraid'
        run: |
          set -euo pipefail
          docker rm -f phlix-camera-upload
          python3 -I "$RUNNER_TEMP/unraid-apply.py" "$RUNNER_TEMP/template.xml" "$PHOTOS"

      - name: The helper answers again
        run: |
          set -uo pipefail
          for attempt in $(seq 1 90); do
            if [ "$(curl --silent --insecure --max-time 5 https://127.0.0.1:7459/healthz)" = ok ]; then
              echo "The helper answered after $attempt tries."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The helper did not answer again in 3 minutes."
          exit 1

      - name: "The app, later: still paired, nothing twice"
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/phone.py" again "$SERVER" "$PHOTOS" "$RUNNER_TEMP/phone-state.json" \
            | tee "$RUNNER_TEMP/phone-again.txt"
          echo "- The app, after an update and a restart: $(tail -n 1 "$RUNNER_TEMP/phone-again.txt")" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.way }}" = unraid ]; then
            docker logs phlix-camera-upload 2>&1 | grep --fixed-strings "Running as user 99, group 100"
            [ "$(stat --format '%u:%g' /mnt/user/appdata/phlix-camera-upload)" = 99:100 ]
          fi

      # The log names the pairing code each time the helper starts. The
      # container ends with this job, and the code is hidden anyway.
      - name: The helper's log, with the pairing code hidden
        if: always()
        run: |
          docker logs phlix-camera-upload 2>&1 | sed 's/\(Pairing code: \).*/\1(hidden)/' || true
          echo "::group::What the Plex stand-in was asked"
          cat "$RUNNER_TEMP/plex-stand-in.log" || true
          echo "::endgroup::"

      # -- Remove the helper -------------------------------------------------

      - name: "Remove the helper: the photos stay"
        run: |
          set -euo pipefail
          if [ "${{ matrix.way }}" = unraid ]; then
            docker rm -f phlix-camera-upload
          else
            cd ~/phlix-camera-upload
            docker compose down
          fi
          [ -z "$(docker ps --all --quiet --filter name=phlix-camera-upload)" ]
          test -f "$PHOTOS/Stranger's iPhone/2025/2025-07/IMG_0001.JPG"
          test -f "$PHOTOS/Stranger's iPhone/2025/2025-07/IMG_0001 (2).JPG"
          echo "The helper is gone, and both photos are still in $PHOTOS."
          echo "- Removed: the photos stay." >> "$GITHUB_STEP_SUMMARY"
