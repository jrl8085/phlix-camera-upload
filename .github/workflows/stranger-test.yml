      - name: "Check that it runs: the status page at the server's address"
        run: |
          set -euo pipefail
          address=$(hostname -I | awk '{ print $1 }')
          case "${{ matrix.way }}" in
            installer)
              url=$(sed -n 's/^ *Status page: *//p' "$RUNNER_TEMP/install.txt" | head -n 1)
              ;;
            unraid)
              webui=$(sed -n 's|^ *<WebUI>\(.*\)</WebUI>.*|\1|p' "$RUNNER_TEMP/template.xml")
