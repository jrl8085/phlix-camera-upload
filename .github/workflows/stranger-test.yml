          done
          echo "::error::The helper did not answer on https://127.0.0.1:7459/healthz in 3 minutes."
          docker ps --all
          exit 1

      - name: The image that runs, and the machine it runs on
        run: |
          set -euo pipefail
          image=$(docker inspect --format '{{.Config.Image}}' phlix-camera-upload)
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
